<!DOCTYPE html>
<html lang="ja" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title> <!-- router.jsで画面遷移時に自動設定 -->
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Markdown Styles -->
  <link rel="stylesheet" href="css/markdown.css">
  <!-- App Common Styles -->
  <link rel="stylesheet" href="css/app.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Import Map for ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js",
      "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@4.4.5/dist/vue-router.esm-browser.js",
      "@vue/devtools-api": "https://cdn.jsdelivr.net/npm/@vue/devtools-api@6.6.3/lib/esm/index.min.js",
      "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.esm.js",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.es.mjs",
      "wavesurfer.js": "https://cdn.jsdelivr.net/npm/wavesurfer.js@7.9.1/dist/wavesurfer.esm.js",
      "wavesurfer.js/plugins/record": "https://cdn.jsdelivr.net/npm/wavesurfer.js@7.9.1/dist/plugins/record.esm.js"
    }
  }
  </script>
</head>
<body>
  <div id="app" class="d-flex flex-column flex-md-row vh-100 overflow-hidden">
    <app-sidebar></app-sidebar>
    <main class="flex-grow-1 p-3 p-md-4 overflow-auto">
      <router-view></router-view>
    </main>
    <app-toast></app-toast>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main Application Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
