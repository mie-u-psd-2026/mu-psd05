<!DOCTYPE html>
<html lang="ja" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AppName</title>
  <!-- Bootstrap 5.3 CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <!-- Markdown Styles -->
  <link rel="stylesheet" href="css/markdown.css">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Import Map for ES Modules -->
  <script type="importmap">
  {
    "imports": {
      "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js",
      "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@4.4.5/dist/vue-router.esm-browser.js",
      "@vue/devtools-api": "https://cdn.jsdelivr.net/npm/@vue/devtools-api@6.6.3/lib/esm/index.min.js",
      "marked": "https://cdn.jsdelivr.net/npm/marked@15.0.7/lib/marked.esm.js",
      "dompurify": "https://cdn.jsdelivr.net/npm/dompurify@3.2.4/dist/purify.es.mjs",
      "wavesurfer.js": "https://cdn.jsdelivr.net/npm/wavesurfer.js@7.9.1/dist/wavesurfer.esm.js",
      "wavesurfer.js/plugins/record": "https://cdn.jsdelivr.net/npm/wavesurfer.js@7.9.1/dist/plugins/record.esm.js"
    }
  }
  </script>
  <style>
    /* Vue transition */
    .fade-enter-active,
    .fade-leave-active {
      transition: opacity 0.25s ease;
    }
    .fade-enter-from,
    .fade-leave-to {
      opacity: 0;
    }
    @media print {
      #app {
        display: block !important;
        min-height: auto !important;
        height: auto !important;
      }
      main {
        overflow: visible !important;
        padding: 0 !important;
      }
      .card {
        border: none !important;
        box-shadow: none !important;
      }
      .card-header {
        border-bottom: none !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
      }
      .card-body {
        padding: 0 !important;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="d-flex flex-column flex-md-row min-vh-100">
    <app-sidebar></app-sidebar>
    <main class="flex-grow-1 p-3 p-md-4 overflow-auto">
      <router-view></router-view>
    </main>
    <app-toast></app-toast>
  </div>

  <!-- Bootstrap Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Main Application Module -->
  <script type="module" src="app.js"></script>
</body>
</html>
